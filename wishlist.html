<!DOCTYPE html>
<html lang="en" data-theme="heritage">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist | FloraMesh Pakistan</title>
  <meta name="description" content="View and manage your saved FloraMesh plants, IoT soil sensors, and artisan garden supplies. Move items directly to your basket.">
  <link rel="canonical" href="https://floramesh.pk/wishlist.html">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Wishlist | FloraMesh Pakistan">
  <meta property="og:description" content="View and manage your saved smart landscaping packages and artisan pottery.">
  <meta property="og:image" content="assets/images/brand/floramesh-logo.svg">

  <link rel="icon" type="image/svg+xml" href="assets/images/brand/favicon.svg">

  <!-- Theme pre-paint script (Zero FOUT) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('floramesh_theme_v1');
        if (!t) {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'midnight' : 'heritage';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Preload Critical Variable Fonts -->
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-variable.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header-mount"></div>

  <!-- WordPress conversion: page-wishlist.php -->
  <main id="main-content">
    <div class="container section">
      <div class="section__eyebrow">Saved Items</div>
      <h1 class="section__title" style="margin-bottom:var(--space-2);">Your Wishlist</h1>
      <p style="color:var(--color-text-muted);max-width:54ch;margin-bottom:var(--space-8);font-size:var(--text-base);">
        Save packages, soil telemetry, and artisan planters to compare or move directly to your garden basket whenever you are ready.
      </p>
      <div id="wishlist-page-mount"></div>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="data/products.js"></script>
  <script src="js/search.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/product.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
