<!DOCTYPE html>
<html lang="en" data-theme="heritage">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Planting Packages, IoT Soil Sensors &amp; Planters | FloraMesh Pakistan</title>
  <meta name="description" content="Browse FloraMesh turnkey planting packages, wireless soil moisture sensors, Multani Blue Pottery planters, Seedistry organic mix, and community tree tokens.">
  <link rel="canonical" href="https://floramesh.pk/shop.html">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://floramesh.pk/shop.html">
  <meta property="og:title" content="Shop Planting Packages, IoT Soil Sensors &amp; Planters | FloraMesh">
  <meta property="og:description" content="Turnkey planting packages, wireless IoT soil telemetry, and authentic Pakistani ceramic planters.">
  <meta property="og:image" content="assets/images/banners/category-services.webp">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shop Planting Packages, IoT Soil Sensors &amp; Planters | FloraMesh">
  <meta name="twitter:description" content="Turnkey planting packages, wireless IoT soil telemetry, and authentic Pakistani ceramic planters.">
  <meta name="twitter:image" content="assets/images/banners/category-services.webp">

  <link rel="icon" type="image/svg+xml" href="assets/images/brand/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Theme pre-paint script (Zero FOUT) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('floramesh_theme_v1');
        if (!t) {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'midnight' : 'heritage';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <!-- Preload Critical Variable Fonts -->
  <link rel="preload" href="assets/fonts/plus-jakarta-sans-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-variable.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <div id="site-header-mount"></div>

  <main id="main-content">

    <!-- Page Header Banner -->
    <section class="section section--alt" style="padding:var(--space-8) 0;border-bottom:1px solid var(--color-border);">
      <div class="container">
        <nav class="pdp__breadcrumb" aria-label="Breadcrumb" style="margin-bottom:var(--space-3);">
          <ol>
            <li><a href="index.html">Home</a></li>
            <li aria-current="page"><strong id="shop-breadcrumb-current">Shop All</strong></li>
          </ol>
        </nav>
        <div class="section__eyebrow">Planting Packages &amp; IoT Care</div>
        <h1 class="section__title">Shop</h1>
        <p class="section__intro">Turnkey planting, smart soil sensors, and artisan planters, made for Islamabad's climate.</p>
      </div>
    </section>

    <div class="container shop-layout">
      <!-- Desktop & Mobile Filter Sidebar Backdrop & Panel -->
      <div class="overlay-backdrop" id="shop-sidebar-backdrop" aria-hidden="true"></div>
      <aside class="filter-panel shop-sidebar" id="shop-sidebar" aria-labelledby="shop-filters-title">
        <div class="shop-sidebar__header">
          <span class="shop-sidebar__handle" aria-hidden="true"></span>
          <h2 id="shop-filters-title">Filters</h2>
          <button type="button" class="header-action-btn" id="close-filters-sheet-btn" aria-label="Close filters">
            <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="shop-sidebar__content">
          <div class="filter-group">
          <label for="shop-search-input">Search products</label>
          <input type="search" id="shop-search-input" placeholder="e.g. sensor, blue pottery, balcony..." autocomplete="off">
          </div>
          <div class="filter-group">
          <label for="shop-space-select">Space / Environment</label>
          <select id="shop-space-select">
            <option value="all">All Spaces</option>
            <option value="balcony">Apartment Balcony</option>
            <option value="rooftop">Rooftop Terrace</option>
            <option value="indoor">Indoor &amp; Living Room</option>
            <option value="office">Corporate Office</option>
            <option value="kitchen">Kitchen Garden</option>
          </select>
          </div>
          <div class="filter-group">
          <label for="shop-category-select">Category</label>
          <select id="shop-category-select">
            <option value="all">All categories</option>
            <option value="planting-services">On-Demand Planting Services</option>
            <option value="smart-monitoring">Smart Monitoring &amp; IoT Kits</option>
            <option value="plant-care-supplies">Plant Care Supplies &amp; Planters</option>
            <option value="learning-hub">Learning Hub &amp; DIY Kits</option>
            <option value="community-csr">Community, CSR &amp; Eco Gifting</option>
          </select>
          </div>
          <div class="filter-group">
          <label for="shop-price-range" style="display:flex;justify-content:space-between;">
            <span>Max Price (PKR)</span>
            <span id="shop-price-label" style="color:var(--color-link);font-weight:var(--weight-bold);font-variant-numeric:tabular-nums;">Up to Rs 78,000</span>
          </label>
          <input type="range" id="shop-price-range" min="1000" max="78000" step="500" value="78000">
          </div>
          <div class="filter-group">
          <label style="display:flex;align-items:center;gap:var(--space-2);cursor:pointer;font-size:var(--text-sm);font-weight:normal;margin-bottom:var(--space-2);">
            <input type="checkbox" id="shop-stock-checkbox" style="accent-color:var(--color-primary);width:16px;height:16px;">
            <span>In-stock items only</span>
          </label>
          <label style="display:flex;align-items:center;gap:var(--space-2);cursor:pointer;font-size:var(--text-sm);font-weight:normal;">
            <input type="checkbox" id="shop-gift-checkbox" style="accent-color:var(--color-primary);width:16px;height:16px;">
            <span>Gift-ready hampers only</span>
          </label>
          </div>
        </div>
        <div class="shop-sidebar__footer">
          <button type="button" class="btn btn--outline btn--sm btn--full" id="shop-clear-filters-btn">Clear all filters</button>
        </div>
      </aside>

      <!-- Main Catalog Content -->
      <div>
        <div class="shop-toolbar">
          <div id="shop-product-count" style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--color-text-muted);" aria-live="polite">Showing products</div>
          <div id="shop-active-filters" class="shop-toolbar__chips"></div>
          <div class="shop-toolbar__controls">
            <!-- Mobile Filter Trigger -->
            <button type="button" class="btn btn--outline btn--sm mobile-filter-trigger" id="open-filters-sheet-btn">
              <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
              <span>Filters</span>
            </button>
            <label for="shop-sort-select" style="font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--color-text-muted);" class="sr-only">Sort by</label>
            <select id="shop-sort-select" style="padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text);font-size:var(--text-xs);">
              <option value="featured">Featured first</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="name-asc">Name: A to Z</option>
            </select>
            <button type="button" class="btn btn--sm btn--outline" id="shop-view-grid-btn" aria-label="Grid view" aria-pressed="true">
              <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </button>
            <button type="button" class="btn btn--sm btn--outline" id="shop-view-list-btn" aria-label="List view" aria-pressed="false">
              <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div class="grid-3" id="shop-product-grid"></div>

        <div style="text-align:center;margin-top:var(--space-8);">
          <button type="button" class="btn btn--primary" id="shop-load-more-btn">Load more products</button>
        </div>
      </div>
    </div>

    <!-- Botanical Delight: Pot Sizer & Soil Volume Calculator -->
    <div class="container section" style="margin-top:var(--space-8);" id="soil-calculator-mount"></div>

  </main>

  <div id="site-footer-mount"></div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="data/products.js"></script>
  <script src="js/search.js"></script>
  <script src="js/partials.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/product.js"></script>
  <script src="js/delight.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
